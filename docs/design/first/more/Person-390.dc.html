<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Someone's profile, phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../ds/voices/tokens.css">
<link rel="stylesheet" href="../ds/voices/components/bundle.css">
<script src="../ds/voices/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&amp;family=Bagel+Fat+One&amp;display=swap">
<style>
.c-scroll{scrollbar-width:none}.c-scroll::-webkit-scrollbar{display:none}.c-scroll>*,.c-scroll>.sc-host-x>*{flex-shrink:0}.c-hs{scrollbar-width:none}.c-hs::-webkit-scrollbar{display:none}
.c-tabbar .vx-bottombar{margin:0;border-radius:0;box-shadow:none;background:none}
body{margin:0}
a{color:var(--green-text)}a:hover{color:var(--ink)}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; background: var(--bg); color: var(--ink); font-family: var(--font-body); display: flex; flex-direction: column;">
<header style="flex: none; display: flex; align-items: center; gap: 4px; box-sizing: border-box; height: 103px; padding: 47px 8px 0; background: var(--bg);">
<x-import component-from-global-scope="Voices.IconButton" icon="arrow-left" label="Back"></x-import>
<span style="flex: 1;"></span>
<x-import component-from-global-scope="Voices.IconButton" icon="share-2" label="Share @tunde.a's profile"></x-import>
<x-import component-from-global-scope="Voices.IconButton" icon="ellipsis" label="More: report or block @tunde.a"></x-import>
</header>
<main class="c-scroll" style="flex: 1; min-height: 0; overflow-y: auto; box-sizing: border-box; padding: 4px 16px 40px; display: flex; flex-direction: column; gap: 16px;">
<x-import component-from-global-scope="Voices.ProfileHeader" name="Tunde Adewale" handle="@tunde.a" place="Ibadan" joined="Joined Nov 2026" voice-card="{{n7}}" stats="{{stats}}"></x-import>
<x-import component-from-global-scope="Voices.Tabs" items="{{tabs}}" default-value="voices" label="@tunde.a's posts"></x-import>
<article style="display: flex; flex-direction: column; gap: 8px;">
<a href="#" style="font: 600 14px/20px var(--font-body); color: var(--ink-2); text-decoration: none;">On: When salary arrives, how many hours pass before it disappears?</a>
<x-import component-from-global-scope="Voices.AnswerCard" author="{{tunde}}" time="2h" place="Ibadan" voice="{{v1}}" likes="{{n1284}}" replies="{{n86}}" reactions="{{r1}}" label="Most Relatable"></x-import>
</article>
<article style="display: flex; flex-direction: column; gap: 8px;">
<a href="#" style="font: 600 14px/20px var(--font-body); color: var(--ink-2); text-decoration: none;">On: How many hours of light did you get this week? Not what they promised, what you actually got.</a>
<x-import component-from-global-scope="Voices.AnswerCard" author="{{tunde}}" time="3d" place="Ibadan" text="Eleven hours, all of it between 1am and 5am. NEPA is running a night shift for owls." likes="{{n2210}}" replies="{{n140}}" reactions="{{r2}}" label="Most Thought-Provoking"></x-import>
</article>
</main>
<div class="c-tabbar" style="flex: none; position: relative; z-index: 5; background: var(--surface); box-shadow: 0 -1px 0 var(--line); padding-bottom: 20px;">
<x-import component-from-global-scope="Voices.BottomNav" active="home"></x-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      n7: 7, n86: 86, n140: 140, n1284: 1284, n2210: 2210,
      stats: [{ label: 'Voices', value: 112 }, { label: 'Reactions', value: 18400 }, { label: 'Replies', value: 640 }],
      tabs: [{ id: 'voices', label: 'Voices', count: 112 }, { id: 'replies', label: 'Replies', count: 640 }],
      tunde: { handle: '@tunde.a', name: 'Tunde Adewale' },
      v1: { duration: 9, seed: 4, transcript: 'Two hours. I counted. Rent contribution, my mother, then the generator man is already at the gate.' },
      r1: { top: ['💯', '😢', '🔥'], total: 2310 },
      r2: { top: ['😂', '💀'], total: 3120 }
    };
  }
}
</script>
</body>
</html>
