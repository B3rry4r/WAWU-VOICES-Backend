name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, typecheck, test)
    runs-on: ubuntu-latest
    if: hashFiles('api/package.json') != ''
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: voices
          POSTGRES_PASSWORD: voices
          POSTGRES_DB: voices_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U voices"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://voices:voices@localhost:5432/voices_test
      TEST_DATABASE_URL: postgresql://voices:voices@localhost:5432/voices_test
      REDIS_URL: redis://localhost:6379
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  web:
    name: Web (lint, typecheck, build)
    runs-on: ubuntu-latest
    if: hashFiles('web/package.json') != ''
    env:
      NEXT_PUBLIC_API_BASE_URL: https://voices.example.test/api
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
