<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Verify code</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../ds/voices/tokens.css">
<link rel="stylesheet" href="../ds/voices/components/bundle.css">
<script src="../ds/voices/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&amp;family=Bagel+Fat+One&amp;display=swap">
<style>
.c-tabbar .vx-bottombar{margin:0;border-radius:0;box-shadow:none;background:none}
body{margin:0}
a{color:var(--green-text)}a:hover{color:var(--ink)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: var(--font-body);">
<div aria-hidden="true" style="position: absolute; inset: 0; display: flex; flex-direction: column;">
<header style="flex: none; box-sizing: border-box; height: 107px; padding: 47px 16px 0; display: flex; align-items: center; gap: 8px; background: var(--bg); position: relative; z-index: 50;">
<x-import component-from-global-scope="Voices.IconButton" icon="arrow-left" label="Back" variant="ghost" size="s"></x-import>
<span style="flex: 1; font: 600 16px/20px var(--font-body);">Today's question</span>
<x-import component-from-global-scope="Voices.IconButton" icon="share-2" label="Share" variant="ghost" size="s"></x-import>
</header>
<div style="padding: 0 16px; display: flex; flex-direction: column; gap: 16px;">
<x-import component-from-global-scope="Voices.StageBar" current="speak"></x-import>
<p style="margin: 0; font: 400 26px/30px var(--font-display);">When salary arrives, how many hours pass before it disappears?</p>
<div style="display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 20px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line);">
<span class="vx-eyebrow" style="color: var(--ink-2);">Your voice · preview</span>
<x-import component-from-global-scope="Voices.VoicePlayer" duration="{{d9}}" seed="{{seed12}}"></x-import>
</div>
</div>
</div>
<x-import component-from-global-scope="Voices.Sheet" inline="{{yes}}" title="Enter your code" subtitle="We sent 6 digits by SMS to +234 803 214 7720.">
<div style="display: flex; flex-direction: column; gap: 18px;">
<fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px;">
<legend class="vx-sr">Verification code</legend>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px;">
<input aria-label="Digit 1" inputmode="numeric" maxlength="1" value="4" style="box-sizing: border-box; width: 100%; height: 60px; border: 0; border-radius: 14px; background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--line-strong); text-align: center; font: 400 28px/32px var(--font-display); color: var(--ink);">
<input aria-label="Digit 2" inputmode="numeric" maxlength="1" value="1" style="box-sizing: border-box; width: 100%; height: 60px; border: 0; border-radius: 14px; background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--line-strong); text-align: center; font: 400 28px/32px var(--font-display); color: var(--ink);">
<input aria-label="Digit 3" inputmode="numeric" maxlength="1" value="7" style="box-sizing: border-box; width: 100%; height: 60px; border: 0; border-radius: 14px; background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--line-strong); text-align: center; font: 400 28px/32px var(--font-display); color: var(--ink);">
<input aria-label="Digit 4" inputmode="numeric" maxlength="1" value="2" style="box-sizing: border-box; width: 100%; height: 60px; border: 0; border-radius: 14px; background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--line-strong); text-align: center; font: 400 28px/32px var(--font-display); color: var(--ink);">
<input aria-label="Digit 5" inputmode="numeric" maxlength="1" value="" style="box-sizing: border-box; width: 100%; height: 60px; border: 0; border-radius: 14px; background: var(--surface); box-shadow: inset 0 0 0 2px var(--focus), var(--shadow-focus); text-align: center; font: 400 28px/32px var(--font-display); color: var(--ink);">
<input aria-label="Digit 6" inputmode="numeric" maxlength="1" value="" style="box-sizing: border-box; width: 100%; height: 60px; border: 0; border-radius: 14px; background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--line-strong); text-align: center; font: 400 28px/32px var(--font-display); color: var(--ink);">
</div>
<div style="display: flex; align-items: center; justify-content: space-between; font: 500 14px/20px var(--font-body); color: var(--ink-2);">
<span style="display: inline-flex; align-items: center; gap: 6px;"><x-import component-from-global-scope="Voices.Icon" name="clock" size="{{s16}}"></x-import>Resend code in 0:42</span>
<a href="SignIn-390.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; font-weight: 600; text-decoration: none;">Change number</a>
</div>
</fieldset>
<x-import component-from-global-scope="Voices.Button" size="l" block="{{yes}}" disabled="{{yes}}">Verify and post</x-import>
<p class="vx-sheet__fine" style="padding-bottom: 12px;">New here? Next you choose a handle and 3 topics. It takes a minute.</p>
</div>
</x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
yes: true, no: false, h28: 28, h30: 30, h34: 34, s14: 14, s16: 16, s18: 18, s20: 20, s22: 22, s24: 24, s28: 28,
d9: 9, seed12: 12
};
}
}
</script>
</body>
</html>
