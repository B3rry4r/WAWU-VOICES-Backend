name: CI

# Tests run on a pull request that is ready for review, and nowhere else. Running them on every push to
# every branch used up the account's Actions allowance on 14 Nov 2026, and GitHub then refused the deploys.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, typecheck, test)
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: voices
          POSTGRES_PASSWORD: voices
          POSTGRES_DB: voices_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U voices"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://voices:voices@localhost:5432/voices_test
      TEST_DATABASE_URL: postgresql://voices:voices@localhost:5432/voices_test
      REDIS_URL: redis://localhost:6379
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
