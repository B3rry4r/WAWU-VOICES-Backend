<!--
  LCH-09: the page nginx shows when the web server or the API cannot answer (502, 503, 504). One file, nothing to fetch:
  the app may be the thing that is down, so no script, no font file and no outside address. Tokens are copied from
  docs/design/ds/tokens.css (light and dark). Keep the words in step with the API's own busy answer
  (api/src/common/busy/busy.ts) and with the JSON answer in voices.conf.
-->
<style>
  :root { --bg: #f5f5f5; --surface: #ffffff; --line: #dce3df; --ink: #0e1a14; --ink-2: #4c5a53; --green: #0da86a; --on-green: #002b1a; --focus: #002b1a; --focus-gap: #ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #04120b; --surface: #0b1f16; --line: #1f3d2f; --ink: #eaf4ee; --ink-2: #a9bdb1; --green: #0da86a; --on-green: #002b1a; --focus: #eaf4ee; --focus-gap: #04120b; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 17px; line-height: 24px; -webkit-text-size-adjust: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px 16px;
  }
  main { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 20px; }
  .logo { display: block; height: 36px; width: auto; align-self: flex-start; }
  .logo.dark { display: none; }
  @media (prefers-color-scheme: dark) { .logo.light { display: none; } .logo.dark { display: block; } }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 28px 22px 24px; display: flex; flex-direction: column; gap: 12px; }
  h1 { margin: 0; font-size: 34px; line-height: 38px; font-weight: 800; letter-spacing: -0.01em; }
  p { margin: 0; color: var(--ink-2); }
  .again {
    margin-top: 8px; display: flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 20px; border-radius: 14px;
    background: var(--green); color: var(--on-green); font-weight: 800; font-size: 17px; text-decoration: none;
  }
  .again:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--focus-gap), 0 0 0 5px var(--focus); }
  @media (min-width: 1024px) { main { max-width: 520px; gap: 28px; } .card { padding: 40px 36px 34px; } h1 { font-size: 44px; line-height: 48px; } .logo { height: 44px; } }
</style>
</head>
