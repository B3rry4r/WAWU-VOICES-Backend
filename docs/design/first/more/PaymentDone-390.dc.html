<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Payment received, phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../ds/voices/tokens.css">
<link rel="stylesheet" href="../ds/voices/components/bundle.css">
<script src="../ds/voices/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&amp;family=Bagel+Fat+One&amp;display=swap">
<style>
.c-scroll{scrollbar-width:none}.c-scroll::-webkit-scrollbar{display:none}.c-scroll>*,.c-scroll>.sc-host-x>*{flex-shrink:0}
body{margin:0}
a{color:var(--green-text)}a:hover{color:var(--ink)}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; background: var(--bg); color: var(--ink); font-family: var(--font-body); display: flex; flex-direction: column;">
<header style="flex: none; display: flex; align-items: center; justify-content: flex-end; box-sizing: border-box; height: 103px; padding: 47px 8px 0; background: var(--bg);">
<x-import component-from-global-scope="Voices.IconButton" icon="x" label="Close"></x-import>
</header>
<main class="c-scroll" aria-labelledby="ok-h" style="flex: 1; min-height: 0; overflow-y: auto; box-sizing: border-box; padding: 0 16px 24px; display: flex; flex-direction: column; gap: 16px;">
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; padding: 0 8px;">
<span style="width: 88px; height: 88px; border-radius: 50%; background: var(--mint); color: var(--green-text); display: flex; align-items: center; justify-content: center;"><x-import component-from-global-scope="Voices.Icon" name="circle-check" size="{{n44}}"></x-import></span>
<h1 id="ok-h" style="margin: 4px 0 0; font: 400 34px/38px var(--font-display); letter-spacing: -0.01em;">55 units added</h1>
<p style="margin: 0; font: 400 16px/24px var(--font-body); color: var(--ink-2);">Payment received. Your balance is now <b style="color: var(--ink);">67.5 Voice Units</b>.</p>
</div>
<x-import component-from-global-scope="Voices.Banner" tone="success" title="Your answer is posted">We kept your draft and sent it the moment your units arrived.</x-import>
<dl style="margin: 0; display: flex; flex-direction: column; padding: 4px 16px; border-radius: var(--radius-l); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); font: 500 15px/21px var(--font-body);">
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line);"><dt style="color: var(--ink-2);">Pack</dt><dd style="margin: 0; font-weight: 700; text-align: right;">Buzz, 55 units (5 bonus)</dd></div>
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line);"><dt style="color: var(--ink-2);">Paid</dt><dd style="margin: 0; font-weight: 700;">₦690</dd></div>
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line);"><dt style="color: var(--ink-2);">Method</dt><dd style="margin: 0; font-weight: 700;">Card ending 4412</dd></div>
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line);"><dt style="color: var(--ink-2);">Reference</dt><dd style="margin: 0; font-weight: 700; font-variant-numeric: tabular-nums;">VU-261202-48213</dd></div>
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 10px 0;"><dt style="color: var(--ink-2);">Time</dt><dd style="margin: 0; font-weight: 700;">2 Dec 2026, 6:14pm</dd></div>
</dl>
</main>
<footer style="flex: none; display: flex; flex-direction: column; gap: 8px; box-sizing: border-box; padding: 12px 16px 34px; background: var(--surface); box-shadow: 0 -1px 0 var(--line);">
<x-import component-from-global-scope="Voices.Button" size="l" block="{{yes}}" icon="message-circle">Back to the conversation</x-import>
<x-import component-from-global-scope="Voices.Button" variant="ghost" block="{{yes}}" icon="file-down">Download receipt</x-import>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { yes: true, n44: 44 };
  }
}
</script>
</body>
</html>
