# VOICES site. provision.sh replaces __DOMAIN__ and __WEB_ROOT__ and certbot adds the 443 server block.
# An older droplet keeps its old copy of this file: see infra/RUNBOOK.md ("Updating the nginx site").
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# LCH-09: keep connections to the two apps open between requests. Without this every request opened a new connection,
# and a burst of them used up the machine's ports and its CPU for nothing.
upstream voices_api {
    server 127.0.0.1:4000;
    keepalive 64;
}
upstream voices_web {
    server 127.0.0.1:3000;
    keepalive 64;
}

limit_req_zone $binary_remote_addr zone=voices_api:10m rate=100r/s;
# A person over the limit is told 429 (the app already knows how to say "wait a moment"), not 503, which is the busy answer below.
limit_req_status 429;

# LCH-09: a few seconds of shared copies for the guest reads that are the same for everybody (the app says which, and
# for how long, with X-Accel-Expires or Cache-Control). Never a request that carries a sign-in token: see the locations.
proxy_cache_path /var/cache/nginx/voices levels=1:2 keys_zone=voices_cache:10m max_size=200m inactive=2m use_temp_path=off;

# www.__DOMAIN__ sends people to the bare address and keeps the path and query. certbot gives this block
# the same certificate and its own 443 listener, so https://www... redirects too.
server {
    listen 80;
    listen [::]:80;
    server_name www.__DOMAIN__;
    return 301 https://__DOMAIN__$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Voice recordings are tiny (about 30 KB for 10 s, a few hundred KB for 60 s) and go to
    # Spaces by presigned PUT, so the API only needs room for photos and JSON.
    client_max_body_size 12m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/xml image/svg+xml font/ttf font/otf;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Microphone is needed on this origin; everything else off.
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # LCH-09: when the web server or the API cannot answer, a person sees one plain page, never a bare error.
    # busy.html is a single file with nothing to fetch (the app may be the thing that is down).
    error_page 502 503 504 =503 /busy.html;
    location = /busy.html {
        internal;
        root /var/www/voices;
        add_header Retry-After "60" always;
        add_header Cache-Control "no-store" always;
    }

    # The API gets the same words in its one error shape, so the app can show them.
    location @api_busy {
        default_type application/json;
        add_header Retry-After "60" always;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":{"code":"UNAVAILABLE","message":"We are busy. Try again in a minute.","requestId":"nginx"}}';
    }

    # Guest reads that are the same for everybody. A request with a token is never served from, or put in, the shared copies.
    # The app sets how long each may be kept; the answers page (it carries a guest's own likes) is not in this list.
    location ~ "^/api/v1/(questions/today|questions/[0-9a-f-]{36}|config/public|share/[^/]+|share/[^/]+/card)$" {
        limit_req zone=voices_api burst=200 nodelay;
        error_page 502 503 504 =503 @api_busy;
        proxy_pass http://voices_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_cache voices_cache;
        proxy_cache_bypass $http_authorization;
        proxy_no_cache $http_authorization;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_use_stale updating error timeout http_502 http_503 http_504;
        # One copy per address, kept as the app asked; nginx gzips it on the way out (so there is one copy, not one per encoding).
        proxy_ignore_headers Vary;
        proxy_set_header Accept-Encoding "";
        # add_header here replaces the ones above, so the safety headers are said again.
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location /api/ {
        limit_req zone=voices_api burst=200 nodelay;
        error_page 502 503 504 =503 @api_busy;
        proxy_pass http://voices_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }

    # The built files never change under their names, so nginx serves them from disk and the browser keeps them a year.
    # deploy.sh gzips them once (gzip_static), so a burst of first visits does not spend the CPU compressing the same files again.
    location /_next/static/ {
        alias __WEB_ROOT__/.next/static/;
        gzip_static on;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://voices_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
