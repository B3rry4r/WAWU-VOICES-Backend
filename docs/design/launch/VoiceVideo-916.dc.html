<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Voice video, 9:16 frame</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../ds/voices/tokens.css">
<link rel="stylesheet" href="../ds/voices/components/bundle.css">
<script src="../ds/voices/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&amp;family=Bagel+Fat+One&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1080px; height: 1920px; box-sizing: border-box; position: relative; overflow: hidden; background: var(--forest); color: var(--on-forest); font-family: var(--font-body); padding: 180px 88px 200px; display: flex; flex-direction: column; gap: 48px">
<div style="display: flex; align-items: center; justify-content: space-between"><x-import component-from-global-scope="Voices.Logo" tone="white" height="{{h60}}" alt="VOICES"></x-import><span data-theme="dark" style="display: inline-flex; align-items: center; height: 64px; padding: 0 26px; border-radius: 999px; background: var(--verified-bg); color: var(--verified); font: 800 30px/36px var(--font-body); letter-spacing: 0.06em">HOPEFUL</span></div>
<h1 style="margin: 40px 0 0; font: 400 84px/90px var(--font-display); letter-spacing: -0.01em">How do you feel about Nigeria right now?</h1>
<div role="img" aria-label="Waveform of the voice, 6 of 10 seconds played" style="height: 260px; display: flex; align-items: center; gap: 10px">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="34"><span style="{{b}}"></span></sc-for>
</div>
<p style="margin: 0; padding: 36px 40px; border-radius: 36px; background: var(--forest-2); font: 700 50px/64px var(--font-body)">Hopeful, because my younger ones are building things with nothing.</p>
<div style="margin-top: auto; display: flex; align-items: center; justify-content: space-between; font: 600 32px/40px var(--font-body); color: var(--on-forest-2)"><span>@ada.okafor · Lagos</span><span>0:06 / 0:10</span></div>
<span style="font: 700 34px/42px var(--font-body)">Add your voice: usevoices.com/go</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1080,"height":1920}}'>
class Component extends DCLogic {
  renderVals() {
    var h = [40, 72, 110, 86, 150, 190, 132, 220, 176, 240, 160, 204, 118, 168, 230, 150, 96, 180, 210, 140, 88, 124, 170, 200, 130, 92, 150, 110, 70, 120, 84, 60, 96, 52];
    var bars = h.map(function (v, i) { return 'flex: 1; height: ' + v + 'px; border-radius: 999px; background: ' + (i < 20 ? 'var(--green)' : 'var(--forest-line)') + (i < 20 ? '' : '; opacity: 0.9'); });
    return { h60: 60, bars: bars };
  }
}
</script>
</body>
</html>
